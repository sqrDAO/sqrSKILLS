name: Weekly Skill Refresh

# Re-researches the time-sensitive skills against their dated baselines once a
# week and opens a pull request with any updates. The PR is the review gate —
# nothing is merged automatically, which matters for legal/visa/crypto data
# where a wrong auto-commit is worse than a stale-but-correct one.
#
# Setup required (one time):
#   1. Add a repository secret named GEMINI_API_KEY
#      (Settings → Secrets and variables → Actions → New repository secret).
#      Get a key from https://aistudio.google.com/apikey.
#   2. Allow Actions to open PRs:
#      Settings → Actions → General → Workflow permissions →
#      enable "Allow GitHub Actions to create and approve pull requests".
#
# Optional but recommended:
#   3. Add a repository secret named REFRESH_PAT (a fine-grained PAT with
#      Contents: read/write and Pull requests: read/write on this repo).
#      GitHub deliberately does not trigger workflows for events raised with
#      the default GITHUB_TOKEN, so a PR opened by this job shows NO checks —
#      the 2026-08-17 refresh sat for two days with a failing test and a green
#      -looking page. With REFRESH_PAT set, the PR triggers Repository Checks
#      normally. Without it, the job still runs the harness inline (below) and
#      reports the result in the PR body, so nothing merges unexamined.

on:
  schedule:
    # 01:00 UTC every Monday (~08:00 Vietnam time, ICT).
    - cron: "0 1 * * 1"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write
  statuses: write  # publish the inline check results onto the PR head commit

concurrency:
  group: weekly-skill-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh skill baselines with Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Required for headless/CI runs so tool calls auto-approve (YOLO);
          # without it the CLI treats the checkout as untrusted and exits 1.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Pin the model; all core tools (file read/write/edit, shell, web
          # search and fetch) are enabled by default and auto-approved in CI.
          settings: |
            {
              "model": {
                "name": "gemini-2.5-pro"
              }
            }
          prompt: |
            You are running an unattended WEEKLY refresh of the time-sensitive
            skills in this repository. Today's date is the workflow run date.
            Do NOT commit or open a PR — just edit files in the working tree; a
            later workflow step packages your changes into a pull request.

            Follow each skill's OWN documented update method. Read each skill's
            SKILL.md first, then refresh in this order:

            1. vietnam-crypto-radar
               - Read references/baseline.md (note its `LAST VERIFIED` date) and
                 references/sources.md.
               - Sweep sources in tier order for material dated AFTER the
                 baseline's LAST VERIFIED date. Apply the skill's verification
                 discipline: only promote a finding to fact (e.g. to
                 EFFECTIVE/CONFIRMED) if it cites a specific instrument number
                 AND is confirmed by EITHER a Tier-1 primary/named-law-firm
                 source OR two INDEPENDENT Tier-2 sources.
               - Tier-3 sources (crypto-native outlets, e.g. blogtienao.com)
                 NEVER promote a finding on their own, and do not count toward
                 the two-Tier-2 threshold. A finding backed only by Tier-2/Tier-3
                 coverage with no Tier-1 primary stays
                 `REPORTED — NEEDS_PRIMARY_SOURCE`. Everything else unconfirmed
                 stays labeled DRAFT/PROPOSED/RUMORED. When in doubt, do NOT
                 promote — keep the lower-confidence status.
               - Before citing ANY source URL, fetch it and confirm it loads
                 and shows the document you are citing. Do not cite a URL you
                 have not opened this run. Past refreshes added anchors that
                 404'd or resolved to a search page, which leaves the claim
                 resting on nothing. Mark each anchor with the date you
                 confirmed it.
               - Never delete an existing caveat, scope note, or verification
                 instruction to make room for new material. Those were added by
                 earlier correction passes. If you believe one is wrong, say so
                 in the summary and leave it in place.
               - If (and only if) you confirm real changes, update
                 references/baseline.md in place and set a fresh `LAST VERIFIED`
                 date.

            2. web3-opportunities
               - Read data/web3_opportunities.json and references/sources.md.
               - Live-verify the time-sensitive fields (status, cadence,
                 typical_check_or_prize, deadlines). Update changed entries and
                 their per-entry `last_verified` to today; update the top-level
                 `last_updated` only if any entry changed. Keep stable fields
                 (type, stage, dilution, chains, regions, url, name) untouched
                 unless clearly wrong.
               - `last_verified` is a claim that YOU looked at that entry's
                 source THIS RUN. Do not bump it on entries you did not
                 actually re-check — a blanket bump makes the whole roster's
                 freshness meaningless. A later step rolls back any date you
                 bump without either changing the entry or attesting it below.
               - If an entry's `url` no longer loads, say so in its `notes` and
                 replace it with the program's current page. A roster entry
                 pointing at a dead domain is worse than no entry.

            3. vietnam-visa-check
               - Read data/vietnam_immigration_policy.json. This skill is
                 offline and conservative. Only change a fact you can confirm
                 against a Tier-1 source (evisa.gov.vn or primary legal source).
                 If you change anything, bump `_meta.last_updated` to today.

            Rules:
            - Per AGENTS.md, if a skill's bundled DATA changed materially, bump
              that SKILL.md `version:` by a PATCH (e.g. 0.2.0 -> 0.2.1).
            - Be conservative: when a fact cannot be verified this run, LEAVE IT
              UNCHANGED rather than guessing. An empty diff is a valid outcome.
            - Make only data/baseline edits. Do not refactor scripts or prompts.

            Finish with TWO files at the repo root:

            1. REFRESH_SUMMARY.md — a short markdown summary of exactly what you
               changed (per skill, with old -> new dates and notable items). Say
               what you REMOVED as well as what you added; a summary that lists
               only additions while the diff also deletes things is a false
               report. If nothing changed, write "No verified changes this week."

            2. REFRESH_VERIFIED.json — the web3-opportunities entry ids you
               actually re-checked against a live source this run, including
               ones you checked and found unchanged:

                   {"web3_opportunities": ["alliance-dao", "yzi-labs"]}

               List only ids you genuinely opened. Dates on unlisted, unchanged
               entries are rolled back automatically. An empty list is a valid
               and honest answer.

      # The refresh agent edits data the skills answer from. Everything below
      # runs against those edits BEFORE a PR exists, because a PR opened by
      # GITHUB_TOKEN may never trigger a check of its own.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Hold the refresh to what it verified
        id: audit
        run: |
          # `last_verified` is a freshness claim. Roll back any date the refresh
          # bumped without either changing the entry or attesting it re-checked
          # that entry, so the field keeps meaning something.
          roster=web3-opportunities/data/web3_opportunities.json
          git show "HEAD:$roster" > /tmp/roster_before.json
          status=pass
          python3 scripts/audit_refresh.py \
            --before /tmp/roster_before.json \
            --after "$roster" \
            --attested REFRESH_VERIFIED.json > /tmp/audit.json || status=fail
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # If the audit did not complete, the rollback did not happen either.
          # Report unknown rather than zero: "0 rolled back" from a crashed audit
          # is the false assurance this whole step exists to prevent.
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          try:
              c = json.load(open("/tmp/audit.json"))["counts"]
              print(f"changed={c['changed']}")
              print(f"attested={c['attested_only']}")
              print(f"reverted={c['unsupported']}")
          except Exception:
              print("changed=unknown")
              print("attested=unknown")
              print("reverted=unknown (audit did not complete)")
          EOF
          rm -f REFRESH_VERIFIED.json

      - name: Run the skill harness
        id: harness
        run: |
          status=pass
          python3 scripts/validate_skills.py > /tmp/validate.json || status=fail
          # Not `... | tail`: a pipeline reports the exit code of its LAST
          # command, so piping to tail would swallow a test failure entirely.
          if ! python3 -m unittest discover -s tests -v > /tmp/tests.txt 2>&1; then
            status=fail
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/validate.json
          tail -40 /tmp/tests.txt

      - name: Check source anchors resolve
        id: anchors
        run: |
          # A citation that 404s is not a weak citation, it is no citation.
          # Dead means definitive (404/410 or no DNS record); a bot-hostile host
          # is reported, not failed, so this cannot block on someone's WAF.
          status=pass
          python3 scripts/check_anchors.py > /tmp/anchors.json || status=fail
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Tolerate a crashed checker: report zeros rather than failing the
          # step outright, since the status above already carries the verdict.
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          try:
              d = json.load(open("/tmp/anchors.json"))
              c, dead = d["counts"], d["dead"]
          except Exception:
              c, dead = {"checked": 0, "dead": 0, "unverified": 0}, []
          print(f"checked={c['checked']}")
          print(f"dead={c['dead']}")
          print(f"unverified={c['unverified']}")
          print("dead_urls=" + ("; ".join(x["url"] for x in dead) or "none"))
          EOF

      - name: Read refresh summary
        id: summary
        run: |
          if [ -f REFRESH_SUMMARY.md ]; then
            # Random delimiter + forced newline: the summary is LLM-written, so
            # it may lack a trailing newline or contain a literal "EOF" line —
            # either breaks a fixed heredoc delimiter and fails the job.
            delim="SUMMARY_$(date +%s)_$RANDOM"
            {
              echo "body<<${delim}"
              cat REFRESH_SUMMARY.md
              echo
              echo "${delim}"
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=Automated weekly skill refresh.' >> "$GITHUB_OUTPUT"
          fi
          rm -f REFRESH_SUMMARY.md

      - name: Build pull request metadata
        id: pr_meta
        run: |
          run_date="$(date -u +%F)"
          changed_skills="$(
            git diff --name-only |
              cut -d/ -f1 |
              grep -E '^(vietnam-crypto-radar|web3-opportunities|vietnam-visa-check)$' |
              sort -u |
              awk 'BEGIN { sep = "" } { printf "%s%s", sep, $0; sep = ", " }'
          )"

          if [ -n "$changed_skills" ]; then
            echo "title=Weekly skill refresh — ${run_date} — ${changed_skills}" >> "$GITHUB_OUTPUT"
          else
            echo "title=Weekly skill refresh — ${run_date} — no verified changes" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          # A PR opened with GITHUB_TOKEN does not trigger workflows, so its
          # checks list stays empty. REFRESH_PAT, when set, makes checks run.
          token: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}
          branch: automation/weekly-skill-refresh
          delete-branch: true
          commit-message: "chore: weekly refresh of time-sensitive skill baselines"
          title: "${{ steps.pr_meta.outputs.title }}"
          body: |
            Automated weekly refresh of the time-sensitive skills
            (`vietnam-crypto-radar`, `web3-opportunities`, `vietnam-visa-check`).

            Each skill was updated following its own documented baseline-diff
            method. **Review the diff before merging** — verify any changed
            legal/visa/crypto facts against their primary sources.

            ## Pre-merge checks

            These ran against the refreshed data in the job that opened this PR,
            because a PR opened by automation may not trigger checks of its own.

            | Check | Result |
            |---|---|
            | Skill harness (validator + tests) | **${{ steps.harness.outputs.status }}** |
            | Source anchors resolve | **${{ steps.anchors.outputs.status }}** — ${{ steps.anchors.outputs.checked }} checked, ${{ steps.anchors.outputs.dead }} dead, ${{ steps.anchors.outputs.unverified }} unverified |
            | Verification honesty | **${{ steps.audit.outputs.status }}** — ${{ steps.audit.outputs.changed }} entries changed, ${{ steps.audit.outputs.attested }} re-verified unchanged, **${{ steps.audit.outputs.reverted }} unsupported dates rolled back** |

            Dead anchors: ${{ steps.anchors.outputs.dead_urls }}

            A `last_verified` date is kept only where the entry's content changed
            or the agent attested it re-checked that entry. Anything else is
            rolled back, so the field is not a blanket assertion.

            ---

            ${{ steps.summary.outputs.body }}

            ---
            🤖 Generated by the weekly-skill-refresh workflow (Gemini CLI).

      # Creating a commit status is not "triggering a workflow", so unlike the
      # checks themselves this DOES work with the default GITHUB_TOKEN. Without
      # it the PR page shows an empty checks list and reads as though nothing
      # ran, which is how a failing test went unnoticed for two days on #28.
      - name: Publish check results onto the PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          HARNESS_STATUS: ${{ steps.harness.outputs.status }}
          ANCHOR_STATUS: ${{ steps.anchors.outputs.status }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          ANCHOR_DEAD: ${{ steps.anchors.outputs.dead }}
          ANCHOR_CHECKED: ${{ steps.anchors.outputs.checked }}
          AUDIT_REVERTED: ${{ steps.audit.outputs.reverted }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          publish() {
            # $1 context, $2 pass/fail, $3 description
            state=success
            [ "$2" = "pass" ] || state=failure
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              -f state="$state" \
              -f context="$1" \
              -f description="$3" \
              -f target_url="$RUN_URL" >/dev/null
          }
          publish "Refresh / harness" "$HARNESS_STATUS" "validator + unittest"
          publish "Refresh / anchors" "$ANCHOR_STATUS" \
            "$ANCHOR_CHECKED checked, $ANCHOR_DEAD dead"
          publish "Refresh / verification honesty" "$AUDIT_STATUS" \
            "$AUDIT_REVERTED unsupported dates rolled back"

      - name: Fail the run if the refresh did not pass its checks
        if: >-
          steps.harness.outputs.status == 'fail' ||
          steps.anchors.outputs.status == 'fail' ||
          steps.audit.outputs.status == 'fail'
        # Passed as env, not interpolated into the script: `${{ }}` expands into
        # the shell source before Bash sees it, and these values derive from URLs
        # the refresh agent copies out of untrusted web pages. A URL containing
        # $(...) would otherwise execute here.
        env:
          HARNESS_STATUS: ${{ steps.harness.outputs.status }}
          ANCHOR_STATUS: ${{ steps.anchors.outputs.status }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          DEAD_URLS: ${{ steps.anchors.outputs.dead_urls }}
        run: |
          # The PR is opened either way — a broken refresh is exactly what needs
          # human eyes — but the Actions run goes red so it is not missed.
          printf 'harness=%s anchors=%s audit=%s\n' \
            "$HARNESS_STATUS" "$ANCHOR_STATUS" "$AUDIT_STATUS"
          printf 'Dead anchors: %s\n' "$DEAD_URLS"
          exit 1
