name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-harness:
    name: Skill Harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate skills and documentation
        run: python3 scripts/validate_skills.py

      - name: Run harness tests
        run: python3 -m unittest discover -s tests -v

      - name: Check the validation split is not stale
        run: python3 evals/scripts/build_visa_cases.py --check
