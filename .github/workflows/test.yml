name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-harness:
    name: Skill Harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The unanchored-instrument check judges what a change introduces, so
          # it needs the base revision. A shallow clone has no `origin/main` to
          # diff against, and the check would pass vacuously.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate skills and documentation
        run: python3 scripts/validate_skills.py

      - name: Run harness tests
        run: python3 -m unittest discover -s tests -v

      - name: Check new legal instruments carry an anchor
        run: |
          # `check_anchors.py` fetches URLs that exist, so it cannot see a claim
          # citing nothing. This is that gap: an instrument number introduced by
          # this change with no anchor beside it. Text only, no network.
          git fetch --no-tags --depth=1 origin main
          python3 scripts/check_unanchored.py --since origin/main

      - name: Check validation splits are not stale
        run: |
          python3 evals/scripts/build_visa_cases.py --check
          python3 evals/scripts/build_web3_cases.py --check
